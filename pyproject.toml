[project]
name = "py-arborium"
description = "Python bindings for arborium: a syntax highlighter powered by tree-sitter, grammars included."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Piya Gehi", email = "piya@orgnizedmess.net" }
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["license", "version"]

[project.urls]
Homepage = "https://github.com/orgnizedmess/py-arborium"

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.5",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"
